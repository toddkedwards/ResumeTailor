        function initializeFirebase() {
            if (!FIREBASE_CONFIG || typeof FIREBASE_CONFIG !== 'object') {
                console.error('Firebase config is not properly set');
                return false;
            }
            
            try {
                const { initializeApp, getAuth, getFirestore, getFunctions } = window.firebaseModules;

                db = getFirestore(app);

        function authenticateUser() {
            if (!auth) return Promise.resolve(false);
            
            return new Promise((resolve) => {
                const { onAuthStateChanged } = window.firebaseModules;
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUserId = user.uid;
                        resolve(true);
                    } else {
                        // Don't auto-authenticate - require email/password
                        currentUserId = null;
                        resolve(false);
                    }
                });
            });
        }
        
        async function signUpWithEmail(email, password) {
            if (!auth) return { success: false, error: 'Auth not initialized' };
            
            try {
                const { createUserWithEmailAndPassword } = window.firebaseModules;
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                currentUserId = userCredential.user.uid;
                
                // Initialize user data in Firestore
                await initializeUserData(userCredential.user.uid, email);
                
                // Track signup event (will be tracked via trackEvent after this function returns)
                
                return { success: true, user: userCredential.user };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function signInWithEmail(email, password) {
            if (!auth) return { success: false, error: 'Auth not initialized' };
            
            try {
                const { signInWithEmailAndPassword } = window.firebaseModules;
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                currentUserId = userCredential.user.uid;
                return { success: true, user: userCredential.user };
            } catch (error) {

        async function initializeUserData(userId, email) {
            if (!db) return;
            
            const { doc, setDoc, serverTimestamp } = window.firebaseModules;
            const userRef = doc(db, `artifacts/${APP_ID}/users/${userId}`);
            
            const userData = {
                email: email,
                subscriptionStatus: 'free',
                dailyGenerations: 0,
                lastGenerationDate: null,
                totalGenerations: 0,
                createdAt: serverTimestamp()
            };
            
            await setDoc(userRef, userData, { merge: true });
        }
        
        async function getUserSubscriptionData() {
            if (!db) {
                console.error('Firestore database not initialized');
                throw new Error('Database not initialized. Please refresh the page.');
            }
            
            if (!currentUserId) {
                console.error('User ID not available');
                throw new Error('User not authenticated');
            }
            
            try {
                const { doc, getDoc } = window.firebaseModules;
                const userRef = doc(db, `artifacts/${APP_ID}/users/${currentUserId}`);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    return {
                        credits: data.credits || 0,
                        hasPaidOnce: data.hasPaidOnce || false,
                    };
                }
                // Document doesn't exist yet - return default values
                return {
                    credits: 0,
                    hasPaidOnce: false,
                };
            } catch (error) {
                // Handle permission errors gracefully
                if (error.code === 'permission-denied' || error.message?.includes('permission')) {
                    console.warn('Permission denied reading user data. This may be from cached code or Firestore rules.');
                    console.warn('If this persists after hard refresh, check Firestore security rules.');
                    // Return default values instead of throwing - allows app to continue
                    return {
                        credits: 0,
                        hasPaidOnce: false,
                    };
                }
                
                // Handle network errors
                if (error.code === 'unavailable' || error.message?.includes('network') || error.message?.includes('fetch')) {
                    console.error('Network error getting user data:', error);
                    throw new Error('Network error. Please check your internet connection.');
                }
                
                console.error('Error getting user data:', error);
                // Return default values instead of throwing for unknown errors
                // This prevents the app from breaking
                return {
                    credits: 0,
                    hasPaidOnce: false,
                };
            }
        }
        
        async function checkUsageLimit() {
            // Check if user is admin (bypass credit checks)
            // Use ref to get current user (works in callbacks/intervals)
            const currentUser = userRef.current || user;
            
            if (!currentUser) {
                return {
                    canGenerate: false,
                    remaining: 0,
                    message: 'Please sign in to check credits',
                    isFree: false
                };
            }
            
            const isAdmin = currentUser && currentUser.email && ADMIN_EMAIL && 
                           currentUser.email.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase().trim();
            
            if (isAdmin) {
                return { 
                    canGenerate: true, 
                    remaining: 9999, // Show unlimited
                    message: 'Admin account - Unlimited generations',
                    isFree: true,
                    isAdmin: true
                };
            }
            
            // No free generations - only credits
            const userData = await getUserSubscriptionData();
            if (!userData) {
                return { 
                    canGenerate: false, 
                    remaining: 0, 
                    message: 'No credits available. Please purchase credits to continue.', 
                    isFree: false 
                };
            }
            
            const { credits } = userData;
            
            // Check if user has credits
            if (credits > 0) {
                return { 
                    canGenerate: true, 
                    remaining: credits, 
                    message: `${credits} credit${credits !== 1 ? 's' : ''} available`,
                    isFree: false 
                };
            }
            
            return { 
                canGenerate: false, 
                remaining: 0, 
                message: 'No credits available. Please purchase credits to continue.', 
                isFree: false 
            };
        }
        
        async function incrementUsage() {
            if (!db || !currentUserId) return;
            
            try {
                const { doc, getDoc, setDoc, updateDoc, serverTimestamp } = window.firebaseModules;
                const userRef = doc(db, `artifacts/${APP_ID}/users/${currentUserId}`);
                const userDoc = await getDoc(userRef);
                
                const userData = userDoc.exists() ? userDoc.data() : {};
                const credits = userData.credits ?? 0;
                
                // Check if user is admin (skip credit deduction)
                // Use ref to get current user (works in callbacks/intervals)
                const currentUser = userRef.current || user;
                const isAdmin = currentUser && currentUser.email && ADMIN_EMAIL && 
                               currentUser.email.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase().trim();
                
                let updateData = {
                    lastGenerationDate: serverTimestamp(),
                };
                
                // Increment total generations
                const currentTotal = userData.totalGenerations || 0;
                updateData.totalGenerations = currentTotal + 1;
                
                // Track credits used
                const currentCreditsUsed = userData.creditsUsed || 0;
                updateData.creditsUsed = currentCreditsUsed + 1;
                
                // Deduct credit (skip for admin accounts)
                if (!isAdmin) {
                    if (credits > 0) {
                        updateData.credits = credits - 1;
                    } else {
                        // Should not happen if checkUsageLimit worked correctly
                        throw new Error('No credits available');
                    }
                } else {
                    // Admin: don't deduct credits, keep existing credits value (or set to 9999)
                    updateData.credits = 9999; // Set to unlimited for admin
                }
                
                console.log('incrementUsage: Updating with data', updateData);
                
                if (userDoc.exists()) {
                    await updateDoc(userRef, updateData);
                    console.log('incrementUsage: Updated existing document');
                } else {
                    await setDoc(userRef, {
                        ...updateData,
                        credits: isAdmin ? 9999 : (updateData.credits ?? 0),
                        hasPaidOnce: false,
                        totalGenerations: 1,
                        creditsUsed: 1,
                        firstGenerationDate: serverTimestamp(),
                        createdAt: serverTimestamp()
                    });
                    console.log('incrementUsage: Created new document');
                }
                
                // Update local state
                const updatedCredits = isAdmin ? 9999 : updateData.credits;

                // Verify the update

                if (verifyDoc.exists()) {
                    console.log('incrementUsage: Verified update', verifyDoc.data());
                }
            } catch (error) {
                console.error('Error incrementing usage:', error);
                console.error('Error details:', {
                    message: error.message,
                    code: error.code,
                    stack: error.stack
                });
            }
        }

            if (status === 'trial' && !additionalData.trialStartDate) {

            }
            
            await updateDoc(userRef, updates);

        function HighlightedText({ original, tailored, changes }) {
            if (!changes || (!changes.added?.length && !changes.modified?.length)) {
                // Fallback: simple text display
                return <p className="text-slate-700 leading-relaxed whitespace-pre-wrap text-sm">{tailored}</p>;
            }
            
            // Create highlighted version
            let highlightedText = tailored;
            const addedKeywords = changes.added || [];
            
            // Highlight added keywords/phrases
            addedKeywords.forEach(keyword => {
                const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                highlightedText = highlightedText.replace(regex, '<mark class="bg-emerald-300 text-emerald-900 font-semibold px-1 rounded">$1</mark>');
            });
            
            return (
                <div 
                    className="text-slate-700 leading-relaxed whitespace-pre-wrap text-sm"
                    dangerouslySetInnerHTML={{ __html: highlightedText }}
                />
            );
        }

        // Error Boundary Component
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            
            static getDerivedStateFromError(error) {
                return { hasError: true };
            }
            
            componentDidCatch(error, errorInfo) {
                console.error('ErrorBoundary caught an error:', error, errorInfo);
                this.setState({
                    error: error,
                    errorInfo: errorInfo
                });
                
                // Track error in analytics if available
                if (window.trackEvent) {
                    window.trackEvent('error_boundary_caught', {
                        error: error?.message || 'Unknown error',
                        componentStack: errorInfo?.componentStack || ''
                    });
                }
            }
            
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 to-slate-800">
                            <div className="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 text-center">
                                <div className="text-6xl mb-4">⚠️</div>
                                <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-4">
                                    Something went wrong
                                </h2>
                                <p className="text-slate-600 dark:text-slate-300 mb-6">
                                    We encountered an unexpected error. Please refresh the page to continue.
                                </p>
                                <div className="space-y-3">
                                    <button
                                        onClick={() => window.location.reload()}
                                        className="w-full px-4 py-3 bg-violet-600 text-white rounded-lg font-semibold hover:bg-violet-700 transition-colors"
                                    >
                                        Refresh Page
                                    </button>
                                    {this.state.error && (
                                        <details className="text-left mt-4">
                                            <summary className="cursor-pointer text-sm text-slate-500 dark:text-slate-400 mb-2">
                                                Error Details (for debugging)
                                            </summary>
                                            <pre className="text-xs bg-slate-100 dark:bg-slate-900 p-3 rounded overflow-auto max-h-40">
                                                {this.state.error.toString()}
                                                {this.state.errorInfo?.componentStack}
                                            </pre>
                                        </details>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                }
                
                return this.props.children;
            }
        }

            function loadTemplate(templateKey, keepExistingData = false) {
                const template = resumeTemplates[templateKey];
                if (template) {

                        // Merge template with existing data, preserving user's contact info and entries
                        setFullResume(prev => ({
                            ...template,
                            contact: prev.contact.name ? prev.contact : template.contact,
                            // Keep existing entries but use template structure as guide
                            experience: prev.experience.length > 0 ? prev.experience : template.experience,
                            education: prev.education.length > 0 ? prev.education : template.education,
                            skills: prev.skills.length > 0 ? prev.skills : template.skills,
                            certifications: prev.certifications.length > 0 ? prev.certifications : template.certifications,
                            projects: prev.projects.length > 0 ? prev.projects : template.projects,
                            summary: prev.summary || template.summary
                        }));
                        showToast('Template structure applied! Your data has been preserved.', 'success');
                    } else {
                        // Load template fresh
                        setFullResume({
                            ...template,
                            contact: { ...template.contact } // Create new object
                        });
                        showToast('Template loaded! Customize it to match your experience.', 'success');
                    }
                    setShowTemplates(false);
                    setShowResumeBuilder(true);
                    trackEvent('resume_template_loaded', { template: templateKey, keepExistingData });

            }

                const newTheme = !isDark;

                localStorage.setItem('resumeforge_theme', newTheme ? 'dark' : 'light');
                trackEvent('theme_toggled', { theme: newTheme ? 'dark' : 'light' });
            };
            
            // Apply theme to document root
            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDark]);
            
            // Performance monitoring
            useEffect(() => {
                if ('PerformanceObserver' in window) {
                    try {
                        // Monitor Largest Contentful Paint (LCP)
                        const lcpObserver = new PerformanceObserver((list) => {
                            const entries = list.getEntries();
                            const lastEntry = entries[entries.length - 1];
                            if (lastEntry && lastEntry.renderTime) {
                                console.log('LCP:', Math.round(lastEntry.renderTime), 'ms');
                                trackEvent('performance_lcp', { value: Math.round(lastEntry.renderTime) });
                            }
                        });
                        lcpObserver.observe({ entryTypes: ['largest-contentful-paint'] });
                        
                        // Monitor First Input Delay (FID)
                        const fidObserver = new PerformanceObserver((list) => {
                            const entries = list.getEntries();
                            entries.forEach((entry) => {

                setBehaviorAnalytics(prev => {

                    // Track feature clicks
                    if (eventName.includes('_clicked') || eventName.includes('_opened')) {
                        const feature = eventName.replace(/_clicked|_opened/g, '');
                        updated.featureClicks = {
                            ...updated.featureClicks,
                            [feature]: (updated.featureClicks[feature] || 0) + 1
                        };
                    }
                    
                    // Track user journey
                    updated.userJourney = [...updated.userJourney, {
                        event: eventName,
                        timestamp: Date.now(),
                        data: eventData
                    }].slice(-50); // Keep last 50 events
                    
                    // Track conversion funnel
                    if (eventName === 'landing_page_viewed' || eventName === 'page_view') {
                        updated.conversionFunnel.landing = true;
                    } else if (eventName === 'user_signed_up' || eventName === 'user_created' || eventName === 'user_signup_success') {
                        updated.conversionFunnel.signup = true;
                    } else if ((eventName === 'resume_tailored' || eventName === 'resume_tailor_clicked') && !updated.conversionFunnel.firstGeneration) {
                        updated.conversionFunnel.firstGeneration = true;
                    } else if (eventName === 'payment_success' || eventName === 'payment_completed' || eventName === 'payment_verified_manually') {
                        updated.conversionFunnel.paid = true;
                    }
                    
                    return updated;

            // Calculate application success metrics
            function calculateApplicationMetrics() {
                if (!Array.isArray(jobApplications)) {
                    return {
                        total: 0,
                        applied: 0,
                        interviews: 0,
                        offers: 0,
                        rejected: 0,
                        withdrawn: 0,
                        applicationToInterviewRate: 0,
                        interviewToOfferRate: 0,
                        overallSuccessRate: 0
                    };
                }
                
                const total = jobApplications.length;
                if (total === 0) {
                    return {
                        total: 0,
                        applied: 0,
                        interviews: 0,
                        offers: 0,
                        rejected: 0,
                        withdrawn: 0,
                        applicationToInterviewRate: 0,
                        interviewToOfferRate: 0,
                        overallSuccessRate: 0
                    };
                }
                
                const statusCounts = jobApplications.reduce((acc, app) => {
                    const status = app.status || 'applied';
                    acc[status] = (acc[status] || 0) + 1;
                    return acc;
                }, {});
                
                const applied = statusCounts.applied || 0;
                const interviews = statusCounts.interview || 0;
                const offers = statusCounts.offer || 0;
                const rejected = statusCounts.rejected || 0;
                const withdrawn = statusCounts.withdrawn || 0;
                
                const applicationToInterviewRate = applied > 0 ? (interviews / applied) * 100 : 0;
                const interviewToOfferRate = interviews > 0 ? (offers / interviews) * 100 : 0;
                const overallSuccessRate = total > 0 ? (offers / total) * 100 : 0;
                
                return {
                    total,
                    applied,
                    interviews,
                    offers,
                    rejected,
                    withdrawn,
                    applicationToInterviewRate: Math.round(applicationToInterviewRate * 10) / 10,
                    interviewToOfferRate: Math.round(interviewToOfferRate * 10) / 10,
                    overallSuccessRate: Math.round(overallSuccessRate * 10) / 10
                };
            }
            
            // Calculate resume performance metrics
            function calculateResumePerformanceMetrics() {
                if (!Array.isArray(analyticsHistory) || analyticsHistory.length === 0) {
                    return {
                        averageAtsScore: 0,
                        bestAtsScore: 0,
                        averageKeywordMatch: 0,
                        bestKeywordMatch: 0,
                        totalGenerations: 0,
                        improvementTrend: 'stable'
                    };
                }
                
                const atsScores = analyticsHistory
                    .filter(a => a.atsScore !== null && a.atsScore !== undefined)
                    .map(a => a.atsScore);
                const keywordMatches = analyticsHistory
                    .filter(a => a.keywordMatches && typeof a.keywordMatches === 'object')
                    .map(a => {
                        const matches = a.keywordMatches;
                        const matched = matches.matched?.length || 0;
                        const total = matched + (matches.missing?.length || 0);
                        return total > 0 ? (matched / total) * 100 : 0;
                    });
                
                const averageAtsScore = atsScores.length > 0 
                    ? Math.round((atsScores.reduce((a, b) => a + b, 0) / atsScores.length) * 10) / 10
                    : 0;
                const bestAtsScore = atsScores.length > 0 ? Math.max(...atsScores) : 0;
                const averageKeywordMatch = keywordMatches.length > 0
                    ? Math.round((keywordMatches.reduce((a, b) => a + b, 0) / keywordMatches.length) * 10) / 10
                    : 0;
                const bestKeywordMatch = keywordMatches.length > 0 ? Math.max(...keywordMatches) : 0;
                
                // Calculate improvement trend (last 5 vs previous 5)
                let improvementTrend = 'stable';
                if (atsScores.length >= 10) {
                    const recent = atsScores.slice(-5);
                    const previous = atsScores.slice(-10, -5);
                    const recentAvg = recent.reduce((a, b) => a + b, 0) / recent.length;
                    const previousAvg = previous.reduce((a, b) => a + b, 0) / previous.length;
                    if (recentAvg > previousAvg + 2) improvementTrend = 'improving';
                    else if (recentAvg < previousAvg - 2) improvementTrend = 'declining';
                }
                
                return {
                    averageAtsScore,
                    bestAtsScore,
                    averageKeywordMatch,
                    bestKeywordMatch,
                    totalGenerations: analyticsHistory.length,
                    improvementTrend
                };
            }

                    const estimated = Math.max(5, Math.min(15, Math.ceil(elapsed * 1.2)));

                    });
                    
                    if (!result.data || !result.data.success) {

                    // Set the tailored resume and analysis results
                    // Clean markdown formatting from the AI response
                    let cleanedResume = cleanMarkdown(result.data.tailoredResume || '');
                    
                    // Aggressively fix any instances where AI wrote "bulletpoint" or "bullet point" instead of actual bullets
                    // This is a comprehensive fix for all possible variations (including _BULLETPOINT where \b doesn't match)
                    cleanedResume = cleanedResume
                        // Catch corrupted placeholders or "BULLETPOINT"/"_BULLETPOINT" (e.g. when \b doesn't match _BULLETPOINT)
                        .replace(/_*BULLET_*P(OINT)?_*/gi, '• ')
                        // Handle all text variations of "bullet point" (word boundary)
                        .replace(/\bbullet\s*point\s*[:•\-*]?\s*/gi, '• ')
                        .replace(/\bbulletpoint\s*[:•\-*]?\s*/gi, '• ')
                        .replace(/\bbullet\s*[:•\-*]?\s*/gi, '• ')
                        .replace(/\bbullet\s*points?\s*/gi, '• ')
                        .replace(/\bbulletpoints?\s*/gi, '• ')
                        // Handle cases where it says "bullet point" followed by text
                        .replace(/\bbullet\s*point\s*([A-Za-z])/gi, '• $1')
                        .replace(/\bbulletpoint\s*([A-Za-z])/gi, '• $1')
                        // Convert any remaining markdown-style bullets (-, *, +) to actual bullets
                        .replace(/^(\s*)[-*+]\s+/gm, '$1• ')
                        // Also handle bullets in the middle of lines (sometimes AI puts them there)
                        .replace(/\s+[-*+]\s+/g, ' • ')
                        // Ensure bullet points have proper spacing (bullet + space)
                        .replace(/•([^\s\n•])/g, '• $1')
                        .replace(/•\s{2,}/g, '• ')
                        // Fix cases where bullet might be missing space after
                        .replace(/([^\s])•/g, '$1 •')
                        // Normalize all bullets to ensure consistency
                        .replace(/[•◦▪▫‣⁃]/g, '•');
                    
                    setTailoredResume(cleanedResume);

            // Calculate ATS score based on keyword matching and resume quality
            function calculateATSScore(keywordMatches, resumeText, jobDescription) {
                if (!keywordMatches || !resumeText || !jobDescription) return null;
                
                let score = 0;
                const maxScore = 100;
                
                // Keyword matching (40 points)
                const matchPercentage = keywordMatches.matchPercentage || 0;
                score += (matchPercentage / 100) * 40;
                
                // Keyword density (20 points)
                const matchedKeywords = keywordMatches.matched || [];
                const jobWords = jobDescription.toLowerCase().split(/\s+/);
                const resumeWords = resumeText.toLowerCase().split(/\s+/);
                const uniqueJobKeywords = [...new Set(jobWords.filter(w => w.length > 4))];
                const foundKeywords = uniqueJobKeywords.filter(kw => 
                    resumeWords.some(rw => rw.includes(kw.toLowerCase()))
                );
                const keywordDensity = uniqueJobKeywords.length > 0 
                    ? (foundKeywords.length / uniqueJobKeywords.length) * 100 
                    : 0;
                score += (keywordDensity / 100) * 20;
                
                // Resume length and structure (20 points)
                const wordCount = resumeText.split(/\s+/).length;
                if (wordCount >= 50 && wordCount <= 500) score += 20;
                else if (wordCount >= 30 && wordCount < 50) score += 15;
                else if (wordCount > 500 && wordCount <= 800) score += 15;
                else if (wordCount < 30) score += 5;
                else score += 10;
                
                // Action verbs and achievements (10 points)
                const actionVerbs = ['achieved', 'improved', 'increased', 'developed', 'managed', 'led', 'created', 'implemented', 'designed', 'optimized'];
                const hasActionVerbs = actionVerbs.some(verb => 
                    resumeText.toLowerCase().includes(verb)
                );
                score += hasActionVerbs ? 10 : 5;
                
                // Quantifiable results (10 points)
                const hasNumbers = /\d+/.test(resumeText);
                const hasPercentages = /%/.test(resumeText);
                const hasMetrics = hasNumbers || hasPercentages;
                score += hasMetrics ? 10 : 5;
                
                return Math.min(Math.round(score), maxScore);
            }

            // Apply a suggestion
            function applySuggestion(suggestion, currentText) {
                if (!suggestion.position || !suggestion.suggestion) {
                    return currentText;
                }
                
                const { start, end } = suggestion.position;
                const before = currentText.substring(0, start);
                const after = currentText.substring(end);
                const newText = before + suggestion.suggestion + after;
                
                // Remove the applied suggestion from the list
                setSuggestions(prev => prev.filter(s => s !== suggestion));
                
                trackEvent('suggestion_applied', { type: suggestion.type });
                return newText;
            }

            // Enhanced Error Handling Utility
            function handleError(error, context = '') {
                const errorCode = error?.code || error?.message?.toLowerCase() || '';
                const errorMessage = error?.message || 'An unexpected error occurred';
                
                let userFriendlyMessage = '';
                let actionMessage = '';
                let errorType = 'error';
                let retryable = false;
                
                // Categorize errors
                if (errorCode.includes('insufficient') || errorCode.includes('credits')) {
                    userFriendlyMessage = 'Insufficient credits';
                    actionMessage = 'Click "Buy Credits" to purchase more credits and continue.';
                    errorType = 'credits';
                } else if (errorCode.includes('network') || errorCode.includes('fetch') || errorCode.includes('failed to fetch')) {
                    userFriendlyMessage = 'Network connection error';
                    actionMessage = 'Please check your internet connection and try again.';
                    errorType = 'network';
                    retryable = true;
                } else if (errorCode.includes('timeout') || errorCode.includes('timed out')) {
                    userFriendlyMessage = 'Request timed out';
                    actionMessage = 'The service may be busy. Please wait a moment and try again.';
                    errorType = 'timeout';
                    retryable = true;
                } else if (errorCode.includes('permission') || errorCode.includes('unauthorized') || errorCode.includes('unauthenticated')) {
                    userFriendlyMessage = 'Authentication required';
                    actionMessage = 'Please sign in to continue.';
                    errorType = 'auth';
                } else if (errorCode.includes('rate limit') || errorCode.includes('resource-exhausted')) {
                    userFriendlyMessage = 'Rate limit exceeded';
                    actionMessage = 'Please wait a moment before trying again.';
                    errorType = 'rate-limit';
                    retryable = true;
                } else if (errorCode.includes('firebase functions not initialized') || errorCode.includes('service not ready')) {
                    userFriendlyMessage = 'Service not ready';
                    actionMessage = 'Please refresh the page to reload the application.';
                    errorType = 'service';
                    retryable = true;
                } else if (errorCode.includes('invalid-argument') || errorCode.includes('invalid argument')) {
                    userFriendlyMessage = 'Invalid input';
                    actionMessage = 'Please check your input and try again.';
                    errorType = 'validation';
                } else {
                    userFriendlyMessage = context ? `Error ${context}` : 'An error occurred';
                    actionMessage = 'Please try again. If the problem continues, refresh the page.';
                    retryable = true;
                }
                
                return {
                    message: userFriendlyMessage,
                    action: actionMessage,
                    type: errorType,
                    retryable: retryable,
                    originalError: errorMessage,
                    fullMessage: actionMessage ? `${userFriendlyMessage}. ${actionMessage}` : userFriendlyMessage
                };
            }

            // Calculate Resume Strength Score - overall quality assessment
            function calculateResumeStrength(resumeText, jobDescription, keywordMatches = null) {
                if (!resumeText || !jobDescription) return null;
                
                let totalScore = 0;
                const maxScore = 100;
                const breakdown = {
                    atsCompatibility: 0,
                    contentQuality: 0,
                    structure: 0,
                    achievements: 0,
                    keywordOptimization: 0
                };
                
                // 1. ATS Compatibility (25 points)
                if (keywordMatches) {
                    const matchPercentage = keywordMatches.matchPercentage || 0;
                    breakdown.atsCompatibility = (matchPercentage / 100) * 25;
                } else {
                    // Basic keyword matching if no keywordMatches provided
                    const jobWords = jobDescription.toLowerCase().split(/\s+/).filter(w => w.length > 4);
                    const resumeWords = resumeText.toLowerCase().split(/\s+/);
                    const matched = jobWords.filter(kw => resumeWords.some(rw => rw.includes(kw)));
                    const matchPercentage = jobWords.length > 0 ? (matched.length / jobWords.length) * 100 : 0;
                    breakdown.atsCompatibility = (matchPercentage / 100) * 25;
                }
                
                // 2. Content Quality (25 points)
                const wordCount = resumeText.split(/\s+/).length;
                // Optimal length: 200-400 words for a section
                if (wordCount >= 200 && wordCount <= 400) breakdown.contentQuality = 25;
                else if (wordCount >= 150 && wordCount < 200) breakdown.contentQuality = 20;
                else if (wordCount > 400 && wordCount <= 600) breakdown.contentQuality = 20;
                else if (wordCount >= 100 && wordCount < 150) breakdown.contentQuality = 15;
                else breakdown.contentQuality = 10;
                
                // 3. Structure and Formatting (20 points)
                const hasBulletPoints = resumeText.includes('•') || resumeText.includes('-') || /^\s*[-•*]\s/m.test(resumeText);
                const hasNumbers = /\d+/.test(resumeText);
                const hasProperCapitalization = /[A-Z]/.test(resumeText);
                let structureScore = 0;
                if (hasBulletPoints) structureScore += 7;
                if (hasNumbers) structureScore += 7;
                if (hasProperCapitalization) structureScore += 6;
                breakdown.structure = structureScore;
                
                // 4. Achievements and Action Verbs (20 points)
                const actionVerbs = ['achieved', 'improved', 'increased', 'developed', 'managed', 'led', 'created', 
                    'implemented', 'designed', 'optimized', 'delivered', 'executed', 'established', 'generated', 
                    'launched', 'reduced', 'enhanced', 'streamlined', 'transformed', 'built'];
                const actionVerbCount = actionVerbs.filter(verb => 
                    resumeText.toLowerCase().includes(verb)
                ).length;
                breakdown.achievements = Math.min(20, (actionVerbCount / 10) * 20);
                
                // Check for quantifiable results (percentages, numbers, metrics)
                const hasQuantifiableResults = /(\d+%|\$\d+|\d+\+|\d+ years?|\d+ months?)/i.test(resumeText);
                if (hasQuantifiableResults) breakdown.achievements = Math.min(20, breakdown.achievements + 5);
                
                // 5. Keyword Optimization (10 points)
                if (keywordMatches) {
                    const matchedKeywords = keywordMatches.matched || [];
                    const missingKeywords = keywordMatches.missing || [];
                    const totalKeywords = matchedKeywords.length + missingKeywords.length;
                    if (totalKeywords > 0) {
                        breakdown.keywordOptimization = (matchedKeywords.length / totalKeywords) * 10;
                    }
                } else {
                    breakdown.keywordOptimization = 5; // Default middle score
                }
                
                totalScore = breakdown.atsCompatibility + breakdown.contentQuality + breakdown.structure + 
                            breakdown.achievements + breakdown.keywordOptimization;
                
                return {
                    score: Math.round(totalScore),
                    breakdown,
                    grade: totalScore >= 90 ? 'A+' :
                           totalScore >= 80 ? 'A' :
                           totalScore >= 70 ? 'B' :
                           totalScore >= 60 ? 'C' :
                           totalScore >= 50 ? 'D' : 'F',
                    recommendations: generateStrengthRecommendations(breakdown, totalScore)
                };
            }
            
            function generateStrengthRecommendations(breakdown, totalScore) {
                const recommendations = [];
                
                if (breakdown.atsCompatibility < 15) {
                    recommendations.push('Add more keywords from the job description to improve ATS compatibility');
                }
                if (breakdown.contentQuality < 15) {
                    recommendations.push('Expand your content to provide more detail about your experience');
                }
                if (breakdown.structure < 12) {
                    recommendations.push('Use bullet points and proper formatting for better readability');
                }
                if (breakdown.achievements < 12) {
                    recommendations.push('Include more action verbs and quantifiable achievements');
                }
                if (breakdown.keywordOptimization < 6) {
                    recommendations.push('Incorporate more relevant keywords from the job description');
                }
                
                if (recommendations.length === 0) {
                    recommendations.push('Your resume is well-optimized! Keep up the great work.');
                }
                
                return recommendations;
            }

            // Rich Text Editor Helper
            function applyFormatting(field, format, value) {
                const textarea = document.querySelector(`textarea[data-field="${field}"]`);
                if (!textarea) return value;
                
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selectedText = value.substring(start, end);
                const before = value.substring(0, start);
                const after = value.substring(end);
                
                let formattedText = '';
                switch (format) {
                    case 'bold':
                        formattedText = `**${selectedText || 'bold text'}**`;
                        break;
                    case 'italic':
                        formattedText = `*${selectedText || 'italic text'}*`;
                        break;
                    case 'bullet':
                        formattedText = selectedText ? selectedText.split('\n').map(line => `• ${line}`).join('\n') : '• ';
                        break;
                    case 'number':
                        formattedText = selectedText ? selectedText.split('\n').map((line, i) => `${i + 1}. ${line}`).join('\n') : '1. ';
                        break;
                    default:
                        formattedText = selectedText;
                }
                
                const newValue = before + formattedText + after;
                const newCursorPos = start + formattedText.length;
                
                // Use requestAnimationFrame for better timing, with fallback check
                requestAnimationFrame(() => {
                    const textareaCheck = document.querySelector(`textarea[data-field="${field}"]`);
                    if (textareaCheck && textareaCheck === textarea) {
                        textareaCheck.focus();
                        try {
                            textareaCheck.setSelectionRange(newCursorPos, newCursorPos);
                        } catch (err) {
                            // Ignore selection errors (may happen if textarea is disabled)
                            console.warn('Could not set cursor position:', err);
                        }
                    }
                });
                
                return newValue;
            }
            
            // Generate full resume text for tailoring
            function generateFullResumeText() {
                let text = '';
                
                // Contact
                if (fullResume.contact.name) text += `${fullResume.contact.name}\n`;
                if (fullResume.contact.email) text += `${fullResume.contact.email} | `;
                if (fullResume.contact.phone) text += `${fullResume.contact.phone} | `;
                if (fullResume.contact.location) text += `${fullResume.contact.location}\n`;
                if (fullResume.contact.linkedin) text += `LinkedIn: ${fullResume.contact.linkedin}\n`;
                if (fullResume.contact.website) text += `Website: ${fullResume.contact.website}\n`;
                text += '\n';
                
                // Summary
                if (fullResume.summary) {
                    text += `PROFESSIONAL SUMMARY\n${fullResume.summary}\n\n`;
                }
                
                // Experience
                if (fullResume.experience.length > 0) {
                    text += 'EXPERIENCE\n';
                    fullResume.experience.forEach(exp => {
                        if (exp.title || exp.company) {
                            text += `${exp.title || ''}${exp.title && exp.company ? ' at ' : ''}${exp.company || ''}\n`;
                            if (exp.location) text += `${exp.location}\n`;
                            if (exp.startDate || exp.endDate) {
                                text += `${exp.startDate || ''}${exp.endDate ? ` - ${exp.endDate}` : (exp.current ? ' - Present' : '')}\n`;
                            }
                            if (exp.description) text += `${exp.description}\n`;
                            text += '\n';
                        }
                    });
                }
                
                // Education
                if (fullResume.education.length > 0) {
                    text += 'EDUCATION\n';
                    fullResume.education.forEach(edu => {
                        if (edu.degree || edu.school) {
                            text += `${edu.degree || ''}${edu.degree && edu.school ? ', ' : ''}${edu.school || ''}\n`;
                            if (edu.location) text += `${edu.location}\n`;
                            if (edu.graduationDate) text += `${edu.graduationDate}\n`;
                            if (edu.gpa) text += `GPA: ${edu.gpa}\n`;
                            if (edu.honors) text += `${edu.honors}\n`;
                            text += '\n';
                        }
                    });
                }
                
                // Skills
                if (fullResume.skills.length > 0) {
                    text += 'SKILLS\n';
                    const skillsList = fullResume.skills.map(s => s.name).filter(s => s).join(', ');
                    if (skillsList) text += `${skillsList}\n\n`;
                }
                
                // Certifications
                if (fullResume.certifications.length > 0) {
                    text += 'CERTIFICATIONS\n';
                    fullResume.certifications.forEach(cert => {
                        if (cert.name) {
                            text += `${cert.name}`;
                            if (cert.issuer) text += ` - ${cert.issuer}`;
                            if (cert.date) text += ` (${cert.date})`;
                            text += '\n';
                        }
                    });
                    text += '\n';
                }
                
                // Projects
                if (fullResume.projects.length > 0) {
                    text += 'PROJECTS\n';
                    fullResume.projects.forEach(proj => {
                        if (proj.name) {
                            text += `${proj.name}\n`;
                            if (proj.description) text += `${proj.description}\n`;
                            if (proj.technologies) text += `Technologies: ${proj.technologies}\n`;
                            if (proj.url) text += `URL: ${proj.url}\n`;
                            text += '\n';
                        }
                    });
                }
                
                return text.trim();
            }
            
            // IndexedDB helper functions for offline saving
            function openIndexedDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('resumeforge-sync', 1);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => resolve(request.result);
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('pendingResumes')) {
                            db.createObjectStore('pendingResumes', { keyPath: 'id', autoIncrement: true });
                        }
                    };
                });
            }
            
            async function saveToIndexedDB(resumeData) {
                try {
                    const db = await openIndexedDB();
                    const transaction = db.transaction(['pendingResumes'], 'readwrite');
                    const store = transaction.objectStore('pendingResumes');
                    await store.add(resumeData);
                    return true;
                } catch (error) {
                    console.error('Error saving to IndexedDB:', error);
                    return false;
                }
            }
            
            async function syncPendingResumes() {
                if (!db || !currentUserId || APP_ID === '__app_id') {
                    return;
                }
                
                try {
                    const db = await openIndexedDB();
                    const transaction = db.transaction(['pendingResumes'], 'readonly');
                    const store = transaction.objectStore('pendingResumes');
                    const pendingResumes = await new Promise((resolve, reject) => {
                        const request = store.getAll();
                        request.onerror = () => reject(request.error);
                        request.onsuccess = () => resolve(request.result || []);
                    });
                    
                    if (pendingResumes.length === 0) return;
                    
                    const { collection, addDoc } = window.firebaseModules;
                    const resumesRef = collection(db, `artifacts/${APP_ID}/users/${currentUserId}/saved_resumes`);
                    
                    for (const resume of pendingResumes) {
                        try {
                            await addDoc(resumesRef, {
                                resume: resume.resume,
                                tailoredResume: resume.tailoredResume,
                                name: resume.name,
                                createdAt: resume.createdAt,
                                jobDescription: resume.jobDescription,
                                sectionType: resume.sectionType
                            });
                            
                            // Remove from IndexedDB after successful sync
                            const deleteTransaction = db.transaction(['pendingResumes'], 'readwrite');
                            const deleteStore = deleteTransaction.objectStore('pendingResumes');
                            await new Promise((resolve, reject) => {
                                const deleteRequest = deleteStore.delete(resume.id);
                                deleteRequest.onerror = () => reject(deleteRequest.error);
                                deleteRequest.onsuccess = () => resolve();
                            });
                            
                            console.log('Synced pending resume:', resume.id);
                        } catch (error) {
                            console.error('Error syncing resume:', error);
                        }
                    }
                    
                    if (pendingResumes.length > 0) {
                        showToast(`Synced ${pendingResumes.length} pending resume(s)`, 'success');
                    }
                } catch (error) {
                    console.error('Error syncing pending resumes:', error);
                }
            }
            
            async function saveResume(resumeText, jobDescription, sectionType) {
                if (!currentUserId || APP_ID === '__app_id') {
                    setError('Firebase not properly configured. Cannot save resume.');
                    return;
                }
                
                // Use resume name or generate default
                const name = resumeName.trim() || `${sectionType || 'general'} - ${new Date().toLocaleDateString()}`;
                
                const resumeData = {
                    resume: resumeText,
                    tailoredResume: resumeText, // For compatibility
                    name: name,
                    createdAt: new Date().toISOString(),
                    jobDescription: jobDescription || '',
                    sectionType: sectionType || 'general',
                    userId: currentUserId,
                    appId: APP_ID
                };
                
                // Check if online
                const isOnline = navigator.onLine;
                
                try {
                    if (isOnline && db) {
                        // Try to save to Firestore first
                        const { collection, addDoc } = window.firebaseModules;
                        const resumesRef = collection(db, `artifacts/${APP_ID}/users/${currentUserId}/saved_resumes`);
                        
                        await addDoc(resumesRef, resumeData);
                        
                        trackEvent('resume_saved', { sectionType: sectionType || 'general', hasName: !!resumeName.trim(), offline: false });
                        showToast('Resume saved successfully!', 'success');
                        setResumeName(''); // Clear name after saving
                    } else {
                        // Offline - save to IndexedDB
                        const saved = await saveToIndexedDB(resumeData);
                        if (saved) {
                            trackEvent('resume_saved', { sectionType: sectionType || 'general', hasName: !!resumeName.trim(), offline: true });
                            showToast('Resume saved offline. It will sync when you\'re back online.', 'success');
                            setResumeName(''); // Clear name after saving
                            
                            // Register background sync
                            if ('serviceWorker' in navigator && 'sync' in window.ServiceWorkerRegistration.prototype) {
                                const registration = await navigator.serviceWorker.ready;
                                await registration.sync.register('sync-resumes');
                            }
                        } else {
                            throw new Error('Failed to save offline');
                        }
                    }
                } catch (err) {
                    const errorMessage = err.message || 'Unknown error occurred';
                    
                    // If online save failed, try offline save
                    if (isOnline && err.code !== 'permission-denied') {
                        try {
                            const saved = await saveToIndexedDB(resumeData);
                            if (saved) {
                                showToast('Saved offline. Will sync when connection is restored.', 'warning');
                                trackEvent('resume_saved', { sectionType: sectionType || 'general', hasName: !!resumeName.trim(), offline: true, fallback: true });
                                setResumeName('');
                                return;
                            }
                        } catch (offlineError) {
                            console.error('Offline save also failed:', offlineError);
                        }
                    }
                    
                    setError(`Error saving resume: ${errorMessage}`);
                    trackEvent('resume_save_error', { error: errorMessage });
                    console.error('Save error:', err);
                    
                    // Show user-friendly error message
                    if (err.code === 'permission-denied') {
                        showToast('Permission denied. Please check your account permissions.', 'error');
                    } else if (err.code === 'unavailable' || !isOnline) {
                        showToast('Service unavailable. Resume saved offline and will sync when connection is restored.', 'warning');
                    } else {
                        showToast('Failed to save resume. Please try again.', 'error');
                    }
                }
            }

            // Fetch analytics history for trends
            async function fetchAnalyticsHistory() {
                if (!db || !currentUserId || APP_ID === '__app_id') return [];
                
                try {
                    const { collection, query, orderBy, limit, getDocs } = window.firebaseModules;
                    const analyticsRef = collection(db, `artifacts/${APP_ID}/users/${currentUserId}/analytics`);
                    const q = query(analyticsRef, orderBy('timestamp', 'desc'), limit(30)); // Last 30 generations
                    const snapshot = await getDocs(q);

                        const data = doc.data();

                            id: doc.id,

                            timestamp: data.timestamp?.toMillis ? data.timestamp.toMillis() : (data.timestamp?.seconds ? data.timestamp.seconds * 1000 : Date.now())
                        });
                    });
                    
                    return history.sort((a, b) => a.timestamp - b.timestamp); // Sort chronologically
                } catch (error) {
                    console.error('Error fetching analytics history:', error);
                    return [];
                }
            }
            
            function copyResume(resumeText, format = 'plain') {
                // Clean markdown formatting before copying
                const cleanText = cleanMarkdown(resumeText);
                let textToCopy = cleanText;
                
                if (format === 'formatted') {
                    // Add basic formatting with markdown-like structure
                    textToCopy = cleanText
                        .split('\n')
                        .map(line => {
                            const trimmed = line.trim();
                            if (trimmed.length === 0) return '';
                            // Detect headers (all caps, short lines)
                            if (trimmed === trimmed.toUpperCase() && trimmed.length < 50 && !trimmed.includes('.')) {
                                return `\n${trimmed}\n${'='.repeat(trimmed.length)}\n`;
                            }
                            // Detect section headers
                            if (/^[A-Z][A-Z\s&]+$/.test(trimmed) && trimmed.length < 50) {
                                return `\n${trimmed}\n${'-'.repeat(trimmed.length)}\n`;
                            }
                            return line;
                        })
                        .join('\n');
                } else if (format === 'html') {
                    // Convert to basic HTML
                    textToCopy = cleanText
                        .split('\n')
                        .map(line => {
                            const trimmed = line.trim();
                            if (trimmed.length === 0) return '<br>';
                            if (trimmed === trimmed.toUpperCase() && trimmed.length < 50 && !trimmed.includes('.')) {
                                return `<h2>${trimmed}</h2>`;
                            }
                            if (/^[A-Z][A-Z\s&]+$/.test(trimmed) && trimmed.length < 50) {
                                return `<h3>${trimmed}</h3>`;
                            }
                            return `<p>${line}</p>`;
                        })
                        .join('\n');
                }
                
                navigator.clipboard.writeText(textToCopy).then(() => {
                    trackEvent('resume_copied', { format });
                    showToast(`Resume copied as ${format} text!`, 'success');
                }).catch((err) => {
                    trackEvent('resume_copy_error', { error: err.message });
                    setError(`Error copying resume: ${err.message}`);
                });
            }

            // Clean markdown formatting from resume text while preserving bullet points
            function cleanMarkdown(text) {
                if (!text || typeof text !== 'string') return text;
                
                // First, aggressively fix any "bulletpoint" text variations BEFORE protecting bullets
                // Include _*BULLET_*P(OINT)?_* to catch _BULLETPOINT, BULLET_POINT, etc. (\\b does not match after _)
                text = text
                    .replace(/_*BULLET_*P(OINT)?_*/gi, '• ')
                    .replace(/\bbullet\s*point\s*[:•\-*]?\s*/gi, '• ')
                    .replace(/\bbulletpoint\s*[:•\-*]?\s*/gi, '• ')
                    .replace(/\bbullet\s*[:•\-*]?\s*/gi, '• ')
                    .replace(/\bbullet\s*points?\s*/gi, '• ')
                    .replace(/\bbulletpoints?\s*/gi, '• ')
                    .replace(/\bbullet\s*point\s*([A-Za-z])/gi, '• $1')
                    .replace(/\bbulletpoint\s*([A-Za-z])/gi, '• $1');
                
                // Protect bullet points by temporarily replacing them.
                // Use <<<BULLET>>> (no underscores) so markdown _ or __ removal cannot corrupt it.
                const bulletPlaceholder = '<<<BULLET>>>';
                // Protect all bullet point formats: -, *, +, • (markdown list indicators)
                // Match at start of line with optional indentation
                let protectedText = text.replace(/^(\s*)([-*+•])\s+/gm, (match, indent, bullet) => {
                    return indent + bulletPlaceholder + ' ';
                });
                // Also protect bullets in the middle of lines (sometimes they appear there)
                protectedText = protectedText.replace(/(\s+)([-*+•])(\s+)/g, (match, before, bullet, after) => {
                    return before + bulletPlaceholder + after;
                });
                // Also protect numbered lists (1. item, 2. item) but convert to bullets for consistency
                protectedText = protectedText.replace(/^(\s*)\d+\.\s+/gm, (match, indent) => {
                    return indent + bulletPlaceholder + ' ';
                });
                
                return protectedText
                    // Remove markdown bold: **text** or __text__
                    .replace(/\*\*([^*]+)\*\*/g, '$1')
                    .replace(/__([^_]+)__/g, '$1')
                    // Remove markdown italic: *text* (but not at start of line - those are bullets)
                    // Only match *text* when it's not at the start of a line and has text on both sides
                    .replace(/(?<!\*)(?<!^)\*([^*\n]+?)\*(?!\*)/gm, '$1')
                    .replace(/(?<!_)(?<!^)_([^_\n]+?)_(?!_)/gm, '$1')
                    // Remove markdown headers: # Header, ## Header, etc.
                    .replace(/^#{1,6}\s+(.+)$/gm, '$1')
                    // Remove markdown code blocks: `code` or ```code```
                    .replace(/```[\s\S]*?```/g, '')
                    .replace(/`([^`]+)`/g, '$1')
                    // Remove markdown links: [text](url)
                    .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
                    // Remove markdown images: ![alt](url)
                    .replace(/!\[([^\]]*)\]\([^\)]+\)/g, '$1')
                    // Remove markdown strikethrough: ~~text~~
                    .replace(/~~([^~]+)~~/g, '$1')
                    // Remove markdown blockquotes: > text
                    .replace(/^>\s+(.+)$/gm, '$1')
                    // Remove markdown horizontal rules: --- or ***
                    .replace(/^[-*]{3,}$/gm, '')
                    // Clean up any remaining markdown artifacts (but preserve our placeholder)
                    .replace(/\*\*/g, '')
                    .replace(/__/g, '')
                    // Restore bullet points (convert placeholder back to • for consistency)
                    .replace(/<<<BULLET>>>/g, '•')
                    // Catch-all: replace any corrupted placeholder or AI "BULLETPOINT"/"_BULLETPOINT" (e.g. when \b doesn't match)
                    .replace(/_*BULLET_*P(OINT)?_*/gi, '• ')
                    // Convert any remaining markdown bullets that weren't protected
                    .replace(/^(\s*)[-*+]\s+/gm, '$1• ')
                    .replace(/\s+[-*+]\s+/g, ' • ')
                    // Normalize all bullet characters to •
                    .replace(/[•◦▪▫‣⁃]/g, '•')
                    // Ensure proper spacing after bullets
                    .replace(/•([^\s\n•])/g, '• $1')
                    .replace(/•\s{2,}/g, '• ')
                    // Clean up extra spaces that might result (but preserve line breaks)
                    .replace(/[ \t]+/g, ' ')
                    .replace(/\n[ \t]+/g, '\n')
                    .replace(/[ \t]+\n/g, '\n')
                    .trim();
            }
            
            function exportToPDF(resumeText, options = {}) {
                try {
                    // Clean markdown formatting before exporting
                    const cleanText = cleanMarkdown(resumeText);
                    
                    // Use jsPDF if available, otherwise fallback to print
                    if (typeof window.jspdf !== 'undefined' && window.jspdf.jsPDF) {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        
                        const margin = 20;
                        const pageWidth = doc.internal.pageSize.width;
                        const pageHeight = doc.internal.pageSize.height;
                        const maxWidth = pageWidth - (margin * 2);
                        let y = margin;
                        
                        // Add header with styling
                        doc.setFillColor(99, 102, 241); // Violet color
                        doc.rect(0, 0, pageWidth, 40, 'F');
                        doc.setTextColor(255, 255, 255);
                        doc.setFontSize(20);
                        doc.setFont('helvetica', 'bold');
                        const title = options.title || resumeName.trim() || 'Tailored Resume';
                        doc.text(title, margin, 25);
                        
                        // Add date
                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'normal');
                        const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                        doc.text(`Generated: ${date}`, margin, 35);
                        
                        // Reset text color for body
                        doc.setTextColor(0, 0, 0);
                        y = 50;
                        
                        // Add section divider
                        doc.setDrawColor(200, 200, 200);
                        doc.line(margin, y, pageWidth - margin, y);
                        y += 10;
                        
                        // Process text with better formatting
                        doc.setFontSize(11);
                        doc.setFont('helvetica', 'normal');
                        const lines = cleanText.split('\n');
                        
                        lines.forEach((line) => {
                            if (!line.trim()) {
                                y += 5; // Add spacing for empty lines
                            } else {
                                // Check if line looks like a heading (short, all caps, or ends with colon)
                                const isHeading = line.length < 50 && (line === line.toUpperCase() || line.endsWith(':'));
                                
                                if (isHeading) {
                                    // Add extra space before heading
                                    if (y > margin + 10) y += 5;
                                    
                                    // Check if we need a new page
                                    if (y > pageHeight - margin - 15) {
                                        doc.addPage();
                                        y = margin;
                                    }
                                    
                                    // Format heading
                                    doc.setFont('helvetica', 'bold');
                                    doc.setFontSize(12);
                                    const headingLines = doc.splitTextToSize(line.replace(':', ''), maxWidth);
                                    headingLines.forEach((headingLine) => {
                                        doc.text(headingLine, margin, y);
                                        y += 7;
                                    });
                                    doc.setFont('helvetica', 'normal');
                                    doc.setFontSize(11);
                                    y += 3; // Extra space after heading
                                } else {
                                    // Regular text
                                    const splitLines = doc.splitTextToSize(line, maxWidth);
                                    splitLines.forEach((splitLine) => {
                                        if (y > pageHeight - margin - 10) {
                                            doc.addPage();
                                            y = margin;
                                        }
                                        doc.text(splitLine, margin, y);
                                        y += 6;
                                    });
                                }
                            }
                        });
                        
                        // Add footer on each page
                        const totalPages = doc.internal.pages.length - 1;
                        for (let i = 1; i <= totalPages; i++) {
                            doc.setPage(i);
                            doc.setFontSize(8);
                            doc.setTextColor(128, 128, 128);
                            doc.text(`ResumeForge - Page ${i} of ${totalPages}`, pageWidth - margin - 50, pageHeight - 10);
                        }
                        
                        // Save the PDF
                        const fileName = (options.fileName || resumeName.trim() || 'tailored-resume').replace(/[^a-z0-9]/gi, '_').toLowerCase();
                        doc.save(`${fileName}.pdf`);
                        trackEvent('resume_exported_pdf', { method: 'jspdf', hasTitle: !!options.title });
                        showToast('PDF exported successfully!', 'success');
                    } else {
                        // jsPDF not available - show error
                        showToast('PDF export library not loaded. Please refresh the page.', 'error');
                        trackEvent('resume_export_pdf_error', { error: 'jsPDF not available' });
                    }
                } catch (error) {
                    console.error('PDF export error:', error);
                    showToast('Error exporting PDF. Please try again.', 'error');
                    trackEvent('resume_export_pdf_error', { error: error.message });
                }
            }
            
            async function exportToWord(resumeText, options = {}) {
                try {

                    const cleanText = cleanMarkdown(resumeText);
                    
                    // Try to use docx library for proper .docx export
                    if (typeof docx !== 'undefined' && docx.Document) {
                        const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;
                        
                        // Split resume into paragraphs
                        const lines = cleanText.split('\n').filter(line => line.trim());
                        const docChildren = [];
                        
                        lines.forEach((line, index) => {
                            const trimmed = line.trim();
                            if (!trimmed) return;
                            
                            // Detect headings (lines that are short and don't end with punctuation)
                            const isHeading = trimmed.length < 50 && 
                                            !trimmed.match(/[.!?]$/) && 
                                            (index === 0 || lines[index - 1]?.trim() === '');
                            
                            if (isHeading) {
                                docChildren.push(
                                    new Paragraph({
                                        text: trimmed,
                                        heading: HeadingLevel.HEADING_2,
                                        spacing: { after: 200 }
                                    })
                                );
                            } else {
                                docChildren.push(
                                    new Paragraph({
                                        text: trimmed,
                                        spacing: { after: 120 }
                                    })
                                );
                            }
                        });
                        
                        const doc = new Document({
                            sections: [{
                                properties: {},
                                children: docChildren.length > 0 ? docChildren : [
                                    new Paragraph({
                                        text: cleanText || 'Resume',
                                        spacing: { after: 200 }
                                    })
                                ]
                            }]
                        });
                        
                        const blob = await Packer.toBlob(doc);
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
