            async function handleResumeUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'application/vnd.apple.pages', 'text/plain'];
                const allowedExtensions = ['.pdf', '.doc', '.docx', '.pages', '.txt'];
                const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
                
                if (!allowedTypes.includes(file.type) && !allowedExtensions.includes(fileExtension)) {
                    showToast('Please upload a PDF, DOC, DOCX, Pages, or TXT file', 'error');
                    return;
                }
                
                if (file.size > 5 * 1024 * 1024) { // 5MB limit
                    showToast('File size must be less than 5MB', 'error');
                    return;
                }
                
                setUploadedFileName(file.name);
                setLoading(true);
                
                try {
                    // Handle different file types
                    if (file.type === 'text/plain') {
                        // Plain text file
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const text = e.target.result;
                            setResumeSection(text);
                            setUploadedResume(text);
                            saveRecentResume(text, file.name);
                            showToast('Resume uploaded successfully!', 'success');
                            setLoading(false);
                        };
                        reader.readAsText(file);
                    } else if (file.type === 'application/pdf') {
                        // PDF file - use pdf.js
                        if (typeof pdfjsLib === 'undefined') {
                            showToast('PDF library not loaded. Please refresh the page.', 'error');
                            setLoading(false);
                            return;
                        }
                        
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = '';
                        
                        // Extract text from all pages, preserving line/paragraph structure via transform positions
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const items = textContent.items || [];
                            // Group items by y (transform[5]) to preserve lines; sort by y desc then x. If transform missing, y/x=0 (one line).
                            const byLine = {};
                            for (const item of items) {
                                const y = (item.transform && item.transform[5] != null) ? item.transform[5] : 0;
                                const x = (item.transform && item.transform[4] != null) ? item.transform[4] : 0;
                                const yKey = Math.round(y * 2) / 2; // bucket similar y
                                if (!byLine[yKey]) byLine[yKey] = [];
                                byLine[yKey].push({ x, str: item.str || '' });
                            }
                            const yCoords = Object.keys(byLine).map(Number).sort((a, b) => b - a);
                            const lines = yCoords.map(y => {
                                byLine[y].sort((a, b) => a.x - b.x);
                                return byLine[y].map(it => it.str).join(' ').trim();
                            });
                            const pageText = lines.filter(Boolean).join('\n');
                            fullText += pageText + '\n\n';
                        }
                        
                        setResumeSection(fullText.trim());
                        setUploadedResume(fullText.trim());
                        saveRecentResume(fullText.trim(), file.name);
                        showToast('PDF uploaded and parsed successfully!', 'success');
                        setLoading(false);
                    } else if (file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' || fileExtension === '.docx') {
                        // DOCX file - use mammoth.js with better text extraction
                        if (typeof mammoth === 'undefined') {
                            showToast('DOCX library not loaded. Please refresh the page.', 'error');
                            setLoading(false);
                            return;
                        }
                        
                        const arrayBuffer = await file.arrayBuffer();
                        
                        try {
                            // First try to convert to markdown to preserve structure
                            const markdownResult = await mammoth.convertToMarkdown({ arrayBuffer: arrayBuffer });
                            let text = markdownResult.value;
                            
                            // If markdown conversion fails or returns empty, fall back to raw text
                            if (!text || text.trim().length === 0) {
                                const rawTextResult = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                                text = rawTextResult.value;
                            }
                            
                            // Clean up the text - preserve line breaks and structure
                            // Convert markdown headers to plain text with line breaks
                            text = text
                                .replace(/^#+\s+/gm, '') // Remove markdown headers
                                .replace(/\*\*(.+?)\*\*/g, '$1') // Remove bold markdown
                                .replace(/\*(.+?)\*/g, '$1') // Remove italic markdown
                                .replace(/^\s*[-*+]\s+/gm, '• ') // Convert markdown bullets to bullet points
                                .replace(/\n{3,}/g, '\n\n') // Normalize multiple line breaks
                                .trim();
                            
                            // Ensure proper paragraph separation
                            // Add line breaks before common section headers
                            const sectionHeaders = [
                                'Professional Summary', 'Summary', 'Objective',
                                'Core Competencies', 'Skills', 'Technical Skills',
                                'Professional Experience', 'Work Experience', 'Employment History',
                                'Education', 'Certifications', 'Projects',
                                'Contact', 'Contact Information'
                            ];
                            
                            sectionHeaders.forEach(header => {
                                const regex = new RegExp(`(${header})`, 'gi');
                                text = text.replace(regex, '\n\n$1');
                            });
                            
                            // Clean up any double line breaks we just added
                            text = text.replace(/\n{3,}/g, '\n\n').trim();
                            
                            // Check for warnings
                            if (markdownResult.messages && markdownResult.messages.length > 0) {
                                console.warn('DOCX parsing warnings:', markdownResult.messages);
                            }
                            
                            setResumeSection(text);
                            setUploadedResume(text);
                            saveRecentResume(text, file.name);
                            showToast('DOCX uploaded and parsed successfully!', 'success');
                            setLoading(false);
                        } catch (parseError) {
                            console.error('Error parsing DOCX:', parseError);
                            // Fallback to raw text extraction
                            try {
                                const rawTextResult = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                                let text = rawTextResult.value;
                                
                                // Basic cleanup for raw text - preserve line/paragraph structure
                                text = text
                                    .replace(/\r\n/g, '\n')
                                    .replace(/\r/g, '\n')
                                    .replace(/\n{3,}/g, '\n\n') // Normalize excessive line breaks
                                    .replace(/[ \t]+/g, ' ') // Collapse only horizontal whitespace (preserve \n)
                                    .replace(/\n /g, '\n')
                                    .replace(/ \n/g, '\n')
                                    .trim();
                                
                                setResumeSection(text);
                                setUploadedResume(text);
                                saveRecentResume(text, file.name);
                                showToast('DOCX uploaded (basic parsing). Some formatting may be lost.', 'warning');
                                setLoading(false);
                            } catch (fallbackError) {
                                console.error('Fallback parsing also failed:', fallbackError);
                                showToast('Error parsing DOCX file. Please try saving as PDF or paste the text manually.', 'error');
                                setLoading(false);
                            }
                        }
                    } else if (file.type === 'application/msword') {

                        showToast('Old DOC format (.doc) is not supported. Please convert to DOCX or PDF, or paste the text manually.', 'error');
                        setLoading(false);
                    } else if (file.type === 'application/vnd.apple.pages' || fileExtension === '.pages') {

                            setLoading(false);
                            return;

                        try {

                            // Pages files contain index.xml with the document content
                            // Try to find and parse the XML

                            // Look for index.xml or preview.pdf
                            if (zip.files['index.xml']) {
                                const xmlContent = await zip.files['index.xml'].async('string');
                                // Simple XML parsing - extract text content
                                // Pages XML is complex, so we'll do basic extraction
                                const textMatches = xmlContent.match(/<pages:span[^>]*>([^<]+)<\/pages:span>/g);
                                if (textMatches) {
                                    text = textMatches.map(match => {
                                        const content = match.match(/<pages:span[^>]*>([^<]+)<\/pages:span>/);
                                        return content ? content[1] : '';
                                    }).join('\n');
                                } else {
                                    // Fallback: extract all text between tags
                                    text = xmlContent.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                                }
                            } else {

                                                        </div>
                                                        
                                                        <div className="space-y-2 mb-4">
                                                            <div>
                                                                <p className={`text-sm font-semibold mb-1 ${
                                                                    isDark ? 'text-slate-300' : 'text-slate-700'
                                                                }`}>💰 Salary Range</p>
                                                                <p className={`text-sm ${
                                                                    isDark ? 'text-slate-400' : 'text-slate-600'
                                                                }`}>{job.salaryRange || 'Not specified'}</p>
                                                            </div>
                                                            <div>
                                                                <p className={`text-sm font-semibold mb-1 ${
                                                                    isDark ? 'text-slate-300' : 'text-slate-700'
                                                                }`}>🎯 Key Skills Match</p>
                                                                <div className="flex flex-wrap gap-2">
                                                                    {job.skillsMatch && job.skillsMatch.length > 0 ? (
                                                                        job.skillsMatch.map((skill, i) => (
                                                                            <span key={i} className={`px-2 py-1 rounded text-xs ${
                                                                                isDark ? 'bg-violet-600 text-white' : 'bg-violet-100 text-violet-700'
                                                                            }`}>
                                                                                {skill || 'Skill'}
                                                                            </span>
                                                                        ))
                                                                    ) : (
                                                                        <span className={`text-xs ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                                                                            No skills listed
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <p className={`text-sm font-semibold mb-1 ${
                                                                    isDark ? 'text-slate-300' : 'text-slate-700'
                                                                }`}>⭐ Growth Potential</p>
                                                                <div className="flex">
                                                                    {[...Array(5)].map((_, i) => (
                                                                        <svg key={i} className={`w-4 h-4 ${
                                                                            i < (job.growthPotential ?? 0)
                                                                                ? 'text-yellow-400' 
                                                                                : isDark ? 'text-slate-600' : 'text-slate-300'
                                                                        }`} fill="currentColor" viewBox="0 0 20 20">
                                                                            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                                                                        </svg>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        
                                                        <div className={`p-3 rounded-lg mb-3 ${
                                                            isDark ? 'bg-slate-800' : 'bg-white'
                                                        }`}>
                                                            <p className={`text-sm font-semibold mb-1 ${
                                                                isDark ? 'text-slate-300' : 'text-slate-700'
                                                            }`}>Why This Match</p>
                                                            <p className={`text-sm ${
                                                                isDark ? 'text-slate-400' : 'text-slate-600'
                                                            }`}>{job.whyMatch || 'No explanation available'}</p>
                                                        </div>
                                                        
                                                        <div className={`p-3 rounded-lg ${
                                                            isDark ? 'bg-slate-800' : 'bg-white'
                                                        }`}>
                                                            <p className={`text-sm font-semibold mb-1 ${
                                                                isDark ? 'text-slate-300' : 'text-slate-700'
                                                            }`}>Company Research</p>
                                                            <p className={`text-sm ${
                                                                isDark ? 'text-slate-400' : 'text-slate-600'
                                                            }`}>{job.companyNotes || 'No company research available'}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-12">
                                            <p className={`text-lg mb-4 ${
                                                isDark ? 'text-slate-300' : 'text-slate-600'
                                            }`}>
                                                Find job matches based on your resume
                                            </p>
                                            <button
                                                onClick={handleFindJobMatches}
                                                className="px-6 py-3 bg-gradient-to-r from-violet-600 to-purple-600 text-white rounded-xl font-semibold hover:from-violet-700 hover:to-purple-700 transition-all duration-300"
                                            >
                                                Find Job Matches
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Resume Preview Modal */}
                    {showResumePreview && tailoredResume && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 animate-fade-in" onClick={(e) => {
                            if (e.target === e.currentTarget) {
                                setShowResumePreview(false);
                            }
                        }}>
                            <div className={`rounded-2xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col ${
                                isDark 
                                    ? 'bg-slate-800 border border-slate-700' 
                                    : 'bg-white'
                            }`} onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center p-6 border-b border-slate-200 dark:border-slate-700">
                                    <h2 className={`text-2xl font-bold ${
                                        isDark ? 'text-white' : 'text-slate-900'
                                    }`}>
                                        📄 Resume Preview
                                    </h2>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => {
                                                setShowResumePreview(false);
                                                exportToPDF(tailoredResume);
                                            }}
                                            className="px-4 py-2 bg-violet-600 text-white rounded-lg text-sm font-semibold hover:bg-violet-700 transition-all"
                                            title="Export as PDF"
                                        >
                                            Export PDF
                                        </button>
                                        <button
                                            onClick={() => setShowResumePreview(false)}
                                            className={isDark ? 'text-slate-300 hover:text-white' : 'text-slate-400 hover:text-slate-600'}
                                        >
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-8 bg-slate-50 dark:bg-slate-900">
                                    <div className={`max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-lg shadow-lg p-8 ${
                                        isDark ? 'text-slate-100' : 'text-slate-900'
                                    }`}>
                                        <div className="prose prose-slate dark:prose-invert max-w-none">
                                            <div className="whitespace-pre-wrap font-serif leading-relaxed">
                                                {tailoredResume.split('\n').map((line, idx) => {
                                                    // Format headers (lines that are all caps or start with specific patterns)
                                                    if (line.trim().length > 0) {
                                                        const isHeader = line === line.toUpperCase() && line.length < 50 && !line.includes('.');
                                                        const isSectionHeader = /^[A-Z][A-Z\s&]+$/.test(line.trim()) && line.length < 50;
                                                        
                                                        if (isHeader || isSectionHeader) {
                                                            return (
                                                                <h3 key={idx} className={`text-xl font-bold mt-6 mb-3 ${
                                                                    isDark ? 'text-white' : 'text-slate-900'
                                                                }`}>
                                                                    {line}
                                                                </h3>
                                                            );
                                                        }
                                                        return (
                                                            <p key={idx} className={`mb-2 ${
                                                                isDark ? 'text-slate-200' : 'text-slate-700'
                                                            }`}>
                                                                {line || '\u00A0'}
                                                            </p>
                                                        );
                                                    }
                                                    return <br key={idx} />;
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        
        // Error suppression for old cached code (temporary)
        // These errors are from old cached JavaScript that will be cleared on next hard refresh
        const originalError = console.error;
        console.error = function(...args) {
            const message = args.join(' ');
            // Suppress errors from old cached code that no longer exists
            if (message.includes('loadUserStats') || 
                message.includes('listening to credits') || 
                message.includes('auto-saving resume text') ||
                (message.includes('Invalid document reference') && message.includes('/stats')) ||
                message.includes('Error loading stats') ||
                message.includes('Error listening to credits') ||
                message.includes('Error auto-saving')) {
                // These are from old cached code, ignore them
                // User should do a hard refresh (Cmd+Shift+R) to clear cache
                return;
            }
            originalError.apply(console, args);
        };
        
        // Force clear service worker cache on load to remove old cached code
        // Only do this once per session to avoid infinite loops
        const cacheCleared = sessionStorage.getItem('resumeforge_cache_cleared');
        if (!cacheCleared && 'serviceWorker' in navigator) {
            sessionStorage.setItem('resumeforge_cache_cleared', 'true');
            navigator.serviceWorker.getRegistrations().then(registrations => {
                if (registrations.length > 0) {
                    registrations.forEach(registration => {
                        // Unregister old service workers to clear cache
                        registration.unregister().then(() => {
                            console.log('Old Service Worker unregistered to clear cache');
                            // Clear all caches aggressively
                            if ('caches' in window) {
                                caches.keys().then(cacheNames => {
                                    return Promise.all(
                                        cacheNames.map(cacheName => {
                                            console.log('Deleting cache:', cacheName);
                                            return caches.delete(cacheName);
                                        })
                                    );
                                }).then(() => {
                                    console.log('All caches cleared. Reloading page to get fresh code...');
                                    // Force reload to get fresh code (only once)
                                    setTimeout(() => {
                                        window.location.reload(true);
                                    }, 500);
                                });
                            }
                        });
                    });
                }
            });
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
